<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>密语 · 密码工具</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxcvbn@4.4.2/dist/zxcvbn.js"></script>
</head>
<body>

<!-- 内联 SVG 图标定义（无网络依赖，无 emoji） -->
<svg style="display:none">
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
</svg>

<div class="app">
  <header class="header">
    <h1><svg class="icon"><use href="#i-lock"/></svg>密语</h1>
    <p class="sub">WebCrypto 原生 · 密码管理 · 密文工具 · 暴力破解演示</p>
  </header>

  <!-- 顶部 Tab -->
  <nav class="tabs">
    <button class="tab active" data-tab="encrypt">
      <svg class="icon-sm"><use href="#i-shield"/></svg>加密工具
    </button>
    <button class="tab" data-tab="vault">
      <svg class="icon-sm"><use href="#i-database"/></svg>密码库
    </button>
    <button class="tab" data-tab="crack">
      <svg class="icon-sm"><use href="#i-zap"/></svg>暴力破解
    </button>
  </nav>

  <!-- Tab 1: 加密工具 -->
  <div class="tab-content active" id="tab-encrypt">
    <div class="grid">
      <!-- 左：配置 -->
      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-settings"/></svg>配置</h2>

        <div class="field">
          <label>主密钥 / 密码</label>
          <div class="input-row">
            <input type="password" id="masterKey" placeholder="输入主密钥" autocomplete="off">
            <button id="toggleMasterKey" class="btn-icon" title="显示/隐藏">
              <svg class="icon-sm"><use href="#i-eye"/></svg>
            </button>
            <button id="genMasterKey" class="btn-icon" title="生成随机密钥">
              <svg class="icon-sm"><use href="#i-refresh"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div id="strengthFill"></div></div>
          <div id="strengthLabel" class="hint">密码强度：未检测</div>
        </div>

        <div class="field">
          <label>明文内容</label>
          <textarea id="plainText" rows="3" placeholder="输入要加密的文本...">生产环境测试消息</textarea>
        </div>

        <div class="field">
          <label>加密方式</label>
          <select id="encryptMethod">
            <option value="aes-gcm">AES-256-GCM (AEAD)</option>
            <option value="aes-cbc-hmac">AES-256-CBC + HMAC-SHA256</option>
            <option value="chacha20">ChaCha20-Poly1305 (如浏览器支持)</option>
            <option value="ecdh-aes">ECDH P-256 + HKDF + AES-GCM</option>
            <option value="ed25519">Ed25519 签名</option>
            <option value="argon2">Argon2id 密码哈希</option>
            <option value="xor">XOR 流密码 (教学)</option>
            <option value="base64">Base64 编码</option>
            <option value="hex">Hex 编码</option>
            <option value="caesar">凯撒位移</option>
            <option value="reverse">字符串反转</option>
          </select>
        </div>

        <div class="field" id="paramField">
          <label>参数 (位移量 / 迭代次数等)</label>
          <input type="number" id="paramInput" value="3" min="1" max="20">
        </div>

        <div class="actions">
          <button id="encryptBtn" class="btn primary">
            <svg class="icon-sm"><use href="#i-shield"/></svg>加密
          </button>
          <button id="resetBtn" class="btn secondary">重置</button>
        </div>
      </section>

      <!-- 右：输出 -->
      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-lock"/></svg>输出</h2>

        <div class="output-block">
          <div class="output-header">
            <span>密文</span>
            <button id="copyCipher" class="btn-icon" title="复制">
              <svg class="icon-sm"><use href="#i-copy"/></svg>
            </button>
          </div>
          <div id="cipherOutput" class="output">等待加密...</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>密钥信息 (盐 / IV / 版本)</span>
            <button id="copyKeyInfo" class="btn-icon" title="复制">
              <svg class="icon-sm"><use href="#i-copy"/></svg>
            </button>
          </div>
          <div id="keyInfoOutput" class="output small">等待生成...</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>安全等级</span>
          </div>
          <div id="securityLabel" class="security-tag real">真实安全 (WebCrypto 原生)</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>解密验证</span>
            <button id="decryptBtn" class="btn-icon" title="解密">
              <svg class="icon-sm"><use href="#i-unlock"/></svg>
            </button>
          </div>
          <div id="decryptOutput" class="output">点击解密验证可逆性</div>
        </div>
      </section>
    </div>
  </div>

  <!-- Tab 2: 密码库 -->
  <div class="tab-content" id="tab-vault">
    <div class="grid">
      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-plus"/></svg>添加条目</h2>
        <div class="field">
          <label>标题</label>
          <input type="text" id="vaultTitle" placeholder="例如：GitHub">
        </div>
        <div class="field">
          <label>用户名</label>
          <input type="text" id="vaultUsername" placeholder="user@example.com">
        </div>
        <div class="field">
          <label>密码</label>
          <div class="input-row">
            <input type="password" id="vaultPassword" placeholder="密码">
            <button id="toggleVaultPwd" class="btn-icon" title="显示/隐藏">
              <svg class="icon-sm"><use href="#i-eye"/></svg>
            </button>
            <button id="genVaultPwd" class="btn-icon" title="生成随机密码">
              <svg class="icon-sm"><use href="#i-refresh"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div id="vaultStrengthFill"></div></div>
          <div id="vaultStrengthLabel" class="hint">密码强度：未检测</div>
        </div>
        <div class="field">
          <label>备注</label>
          <input type="text" id="vaultNote" placeholder="可选">
        </div>
        <div class="actions">
          <button id="saveVaultBtn" class="btn primary">
            <svg class="icon-sm"><use href="#i-plus"/></svg>保存到密码库
          </button>
          <button id="clearVaultBtn" class="btn secondary">清空全部</button>
        </div>
      </section>

      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-search"/></svg>密码条目</h2>
        <div class="field">
          <input type="text" id="vaultSearch" placeholder="搜索标题 / 用户名...">
        </div>
        <div id="vaultList" class="vault-list">
          <div class="empty-state">密码库为空，先添加一条</div>
        </div>
      </section>
    </div>
  </div>

  <!-- Tab 3: 暴力破解 -->
  <div class="tab-content" id="tab-crack">
    <div class="grid">
      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-zap"/></svg>破解配置</h2>
        <div class="field">
          <label>目标密文 (Base64 或 Hex)</label>
          <textarea id="crackTarget" rows="2" placeholder="粘贴要破解的密文..."></textarea>
        </div>
        <div class="field">
          <label>加密方式</label>
          <select id="crackMethod">
            <option value="aes-gcm">AES-256-GCM</option>
            <option value="aes-cbc-hmac">AES-256-CBC + HMAC</option>
            <option value="xor">XOR 流密码</option>
            <option value="caesar">凯撒位移</option>
          </select>
        </div>
        <div class="field">
          <label>攻击模式</label>
          <select id="crackMode">
            <option value="dict">字典攻击 (常见弱密码)</option>
            <option value="numeric">数字穷举 (0000-9999)</option>
            <option value="lowercase">小写字母穷举 (1-4 位)</option>
            <option value="alnum">字母数字穷举 (1-3 位)</option>
          </select>
        </div>
        <div class="field">
          <label>盐 (若加密时使用)</label>
          <input type="text" id="crackSalt" placeholder="Hex 格式的盐">
        </div>
        <div class="field">
          <label>IV (若加密时使用)</label>
          <input type="text" id="crackIv" placeholder="Hex 格式的 IV">
        </div>
        <div class="actions">
          <button id="crackBtn" class="btn primary">
            <svg class="icon-sm"><use href="#i-zap"/></svg>开始破解
          </button>
          <button id="stopCrackBtn" class="btn secondary" disabled>停止</button>
        </div>
      </section>

      <section class="panel">
        <h2><svg class="icon-sm"><use href="#i-search"/></svg>破解进度</h2>
        <div class="output-block">
          <div class="output-header"><span>状态</span></div>
          <div id="crackStatus" class="output">等待开始...</div>
        </div>
        <div class="output-block">
          <div class="output-header"><span>已尝试</span></div>
          <div id="crackCount" class="output">0</div>
        </div>
        <div class="output-block">
          <div class="output-header"><span>耗时</span></div>
          <div id="crackTime" class="output">0 ms</div>
        </div>
        <div class="output-block">
          <div class="output-header"><span>结果</span></div>
          <div id="crackResult" class="output">-</div>
        </div>
      </section>
    </div>
  </div>

  <footer class="footer">
    <p>WebCrypto 原生 · Argon2id WASM · zxcvbn 强度检测 · IndexedDB 密码库</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
