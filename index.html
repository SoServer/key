<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密语</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxcvbn@4.4.2/dist/zxcvbn.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1><img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/lock.svg" class="icon" alt="">密语</h1>
      <p class="sub">生产级密码工具 · WebCrypto 原生 · 真实 AEAD</p>
    </header>

    <div class="grid">
      <!-- 左侧配置 -->
      <section class="panel">
        <h2><img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/settings.svg" class="icon-sm" alt="">配置</h2>

        <div class="field">
          <label>主密钥 (Master Key)</label>
          <div class="input-row">
            <input type="password" id="masterKey" placeholder="输入高强度主密钥" value="">
            <button id="genMasterKey" class="btn-icon" title="生成随机主密钥">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/refresh-cw.svg" alt="">
            </button>
          </div>
          <div class="strength-bar"><div id="strengthFill"></div></div>
          <div id="strengthLabel" class="hint">密码强度：未检测</div>
        </div>

        <div class="field">
          <label>派生密钥用途</label>
          <select id="keyPurpose">
            <option value="encryption">加密密钥 (AES-256-GCM)</option>
            <option value="mac">MAC 密钥 (HMAC-SHA256)</option>
            <option value="signing">签名密钥 (Ed25519)</option>
          </select>
        </div>

        <div class="field">
          <label>明文内容</label>
          <textarea id="plainText" rows="3" placeholder="输入要加密的文本...">生产环境测试消息</textarea>
        </div>

        <div class="field">
          <label>加密方式</label>
          <select id="encryptMethod">
            <option value="aes-gcm">AES-256-GCM (AEAD)</option>
            <option value="chacha20">ChaCha20-Poly1305 (AEAD)</option>
            <option value="ecdh">ECDH P-256 密钥交换 + AES-GCM</option>
            <option value="ed25519">Ed25519 签名</option>
            <option value="argon2">Argon2id 密码哈希</option>
          </select>
        </div>

        <div class="field">
          <label>密钥轮换版本</label>
          <div class="input-row">
            <select id="keyVersion">
              <option value="v1">v1 (当前)</option>
              <option value="v2">v2 (演示轮换)</option>
            </select>
            <button id="rotateKey" class="btn-small">轮换</button>
          </div>
        </div>

        <div class="actions">
          <button id="encryptBtn" class="btn primary">
            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/shield.svg" alt="">加密
          </button>
          <button id="resetBtn" class="btn secondary">重置</button>
        </div>
      </section>

      <!-- 右侧输出 -->
      <section class="panel">
        <h2><img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/output.svg" class="icon-sm" alt="">输出</h2>

        <div class="output-block">
          <div class="output-header">
            <span>密文 (Base64)</span>
            <button id="copyCipher" class="btn-icon" title="复制">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/copy.svg" alt="">
            </button>
          </div>
          <div id="cipherOutput" class="output">等待加密...</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>密钥/盐/IV (Hex)</span>
            <button id="copyKeyInfo" class="btn-icon" title="复制">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/copy.svg" alt="">
            </button>
          </div>
          <div id="keyInfoOutput" class="output small">等待生成...</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>安全等级</span>
          </div>
          <div id="securityLabel" class="security-tag real">真实安全 (WebCrypto 原生)</div>
        </div>

        <div class="output-block">
          <div class="output-header">
            <span>解密验证</span>
            <button id="decryptBtn" class="btn-icon" title="解密">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/unlock.svg" alt="">
            </button>
          </div>
          <div id="decryptOutput" class="output">点击解密验证可逆性</div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <p>WebCrypto 原生 · Argon2id WASM · zxcvbn 强度检测</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
